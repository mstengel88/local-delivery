name: ghos-shopify-bridge

services:
  shopify-bridge:
    build:
      context: ../..
      dockerfile: Dockerfile
    image: ghos/local-delivery-shopify-bridge:${IMAGE_TAG:-latest}
    container_name: ghos-shopify-bridge
    restart: unless-stopped
    env_file:
      - ./bridge.env
      - ./gateway.env
    environment:
      NODE_ENV: production
      PORT: 3000
      RUN_DATABASE_MIGRATIONS: "true"
    ports:
      - "${BRIDGE_BIND_ADDRESS:-0.0.0.0}:${BRIDGE_LAN_PORT:-8086}:3000"
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - fetch('http://127.0.0.1:3000/healthz').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 45s
    networks:
      - ghos-internal

networks:
  ghos-internal:
    external: true
    name: ghos-internal
