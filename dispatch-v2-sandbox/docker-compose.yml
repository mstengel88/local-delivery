services:
  dispatch-v2-sandbox:
    build: .
    container_name: dispatch-v2-sandbox
    env_file:
      - .env
    environment:
      PORT: 3000
    ports:
      - "3010:3000"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:' + (process.env.PORT || 3000) + '/health').then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
    restart: unless-stopped
