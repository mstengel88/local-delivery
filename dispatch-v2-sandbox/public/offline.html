<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#070b18" />
    <title>Green Hills Dispatch Offline</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: Arial, sans-serif;
        background: #070b18;
        color: #f8fafc;
      }

      body {
        align-items: center;
        display: flex;
        min-height: 100vh;
        margin: 0;
        padding: 24px;
      }

      main {
        background: #111827;
        border: 1px solid #26364d;
        border-radius: 24px;
        margin: auto;
        max-width: 520px;
        padding: 28px;
      }

      h1 {
        margin: 0 0 12px;
      }

      p {
        color: #cbd5e1;
        line-height: 1.5;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Dispatch is offline</h1>
      <p>The device cannot reach the dispatch server right now. Reconnect to Wi-Fi or cellular and refresh the app.</p>
    </main>
  </body>
</html>
